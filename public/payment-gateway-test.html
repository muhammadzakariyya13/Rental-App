<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Gateway Connection Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">Payment Gateway - Connection Test</h1>
        
        <!-- Current Configuration -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4">Current Configuration</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Gateway URL:</label>
                    <div class="p-2 bg-gray-50 rounded border font-mono text-sm">
                        https://payment-dummy.doovera.com
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Merchant Code:</label>
                    <div class="p-2 bg-gray-50 rounded border font-mono text-sm">
                        MCH-L9VRWU
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">API Key:</label>
                    <div class="p-2 bg-gray-50 rounded border font-mono text-sm">
                        0bkGS0zEJ5k8Go8FF1zxLdVQY2aWLV1f
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Webhook Secret:</label>
                    <div class="p-2 bg-gray-50 rounded border font-mono text-sm">
                        pLPTCPHCQbLcwScSev8yPIttwXVtw0J
                    </div>
                </div>
            </div>
        </div>

        <!-- Test Actions -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-xl font-semibold mb-4">Connection Tests</h2>
            
            <div class="space-y-3">
                <button onclick="testLaravelConnection()" 
                        class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700">
                    Test Laravel Configuration
                </button>
                
                <button onclick="testGatewayConnection()" 
                        class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700">
                    Test Payment Gateway Connection
                </button>
                
                <button onclick="testCreateTransaction()" 
                        class="w-full bg-purple-600 text-white py-2 px-4 rounded-md hover:bg-purple-700">
                    Test Create Transaction
                </button>
            </div>
        </div>

        <!-- Results -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Test Results</h2>
            <div id="results" class="bg-gray-50 p-4 rounded-md border">
                <p class="text-gray-600">Click a test button to see results...</p>
            </div>
        </div>
    </div>

    <script>
        function updateResults(content) {
            document.getElementById('results').innerHTML = content;
        }

        async function testLaravelConnection() {
            updateResults('<p class="text-blue-600">Testing Laravel configuration...</p>');
            
            try {
                const response = await fetch('/test-payment/connection');
                const result = await response.text();
                
                updateResults(
                    `<p class="text-green-600 font-semibold">✅ Laravel Connection: ${response.status}</p>` +
                    `<pre class="text-sm bg-white p-2 rounded border mt-2">${result}</pre>`
                );
            } catch (error) {
                updateResults(
                    `<p class="text-red-600 font-semibold">❌ Laravel Connection Error:</p>` +
                    `<p class="text-sm mt-2">${error.message}</p>`
                );
            }
        }

        async function testGatewayConnection() {
            updateResults('<p class="text-blue-600">Testing Payment Gateway connection...</p>');
            
            try {
                // Test direct connection to payment gateway
                const response = await fetch('https://payment-dummy.doovera.com', {
                    method: 'GET',
                    headers: {
                        'X-API-Key': '0bkGS0zEJ5k8Go8FF1zxLdVQY2aWLV1f',
                        'Accept': 'application/json'
                    }
                });
                
                const result = await response.text();
                
                updateResults(
                    `<p class="text-green-600 font-semibold">✅ Gateway Connection: ${response.status}</p>` +
                    `<p class="text-sm text-gray-600 mt-1">Direct connection to payment-dummy.doovera.com</p>` +
                    `<pre class="text-sm bg-white p-2 rounded border mt-2">${result}</pre>`
                );
            } catch (error) {
                updateResults(
                    `<p class="text-red-600 font-semibold">❌ Gateway Connection Error:</p>` +
                    `<p class="text-sm mt-2">${error.message}</p>` +
                    `<p class="text-sm text-gray-600 mt-2">This might be due to CORS policy. Check Laravel test instead.</p>`
                );
            }
        }

        async function testCreateTransaction() {
            updateResults('<p class="text-blue-600">Testing transaction creation...</p>');
            
            const testData = {
                external_id: 'TEST-' + Date.now(),
                amount: 100000,
                merchant_code: 'MCH-L9VRWU',
                customer_name: 'Test User',
                customer_email: 'test@example.com',
                payment_method: 'bank_transfer',
                description: 'Test payment transaction'
            };
            
            try {
                const response = await fetch('https://payment-dummy.doovera.com/api/v1/virtual-account/create', {
                    method: 'POST',
                    headers: {
                        'X-API-Key': '0bkGS0zEJ5k8Go8FF1zxLdVQY2aWLV1f',
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(testData)
                });
                
                const result = await response.text();
                
                if (response.ok) {
                    updateResults(
                        `<p class="text-green-600 font-semibold">✅ Transaction Test: SUCCESS (${response.status})</p>` +
                        `<div class="mt-2"><strong>Request:</strong></div>` +
                        `<pre class="text-sm bg-gray-100 p-2 rounded border">${JSON.stringify(testData, null, 2)}</pre>` +
                        `<div class="mt-2"><strong>Response:</strong></div>` +
                        `<pre class="text-sm bg-white p-2 rounded border">${result}</pre>`
                    );
                } else {
                    updateResults(
                        `<p class="text-red-600 font-semibold">❌ Transaction Test: FAILED (${response.status})</p>` +
                        `<div class="mt-2"><strong>Request:</strong></div>` +
                        `<pre class="text-sm bg-gray-100 p-2 rounded border">${JSON.stringify(testData, null, 2)}</pre>` +
                        `<div class="mt-2"><strong>Error Response:</strong></div>` +
                        `<pre class="text-sm bg-white p-2 rounded border">${result}</pre>`
                    );
                }
            } catch (error) {
                updateResults(
                    `<p class="text-red-600 font-semibold">❌ Transaction Test Error:</p>` +
                    `<p class="text-sm mt-2">${error.message}</p>` +
                    `<div class="mt-2"><strong>Test Data:</strong></div>` +
                    `<pre class="text-sm bg-gray-100 p-2 rounded border">${JSON.stringify(testData, null, 2)}</pre>`
                );
            }
        }
    </script>
</body>
</html>
